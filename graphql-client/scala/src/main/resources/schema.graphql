type MetadataSchemaMutations {
  "Start editing an existing metadata schema. Expected that it will be followed by a stopEdit or cancelEdit operation."
  startEdit("ID of the metadata schema to edit, or none to create a new one" id: Long!): EditableEntityMetadataSchema!
  "Start creating a new metadata schema. Typically followed by an add operation with details for new schema."
  startCreate: EditableEntitySkeleton!
  "Cancel editing a metadata schema - discarding any changes made and unlocking the schema."
  cancelEdit("ID of the metadata schema edit session to cancel" id: Long!, "Whether to force cancel the edit session, if true, removes the lock regardless of which session owns it (forced unlock); if false, only removes the lock if the current session owns it. Defaults to false if not provided." force: Boolean): Unit
  "Add a new metadata schema - typically after a startCreate operation, with details for the new schema."
  add("Details of the metadata schema to add" details: EditableEntityMetadataSchemaInput!, "Whether the newly added schema should be locked for editing after creation" lockAfterwards: Boolean!): BaseEntityReference
  "Stop editing a metadata schema - saving changes and optionally unlocking."
  stopEdit("Details of the metadata schema to save" details: EditableEntityMetadataSchemaInput!, "Whether to unlock the schema after saving, if false, keeps it locked for continued editing" unlock: Boolean!): MetadataSchema
  "Delete a metadata schema - with consideration to references controllable by args."
  delete("ID of the metadata schema to delete" id: Long!, "Whether to check for referencing entities before deletion, if true, the deletion will only proceed if there are no referencing entities; if false, will attempt to delete the schema regardless of references which may fail. Defaults to true if not provided." checkReferences: Boolean): Unit
  "Clone a metadata schema - creating a copy of the schema with a new ID."
  clone("ID of the metadata schema to clone" id: Long!): BaseEntityReference
  "Import a metadata schema from a base64-encoded zip file. Returns an editable entity ready for stopEdit to complete the import."
  import("Base64-encoded zip file of the metadata schema to import" zipBase64: String!): EditableEntityMetadataSchema
}

