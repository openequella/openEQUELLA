schema {
  query: Queries
  mutation: Mutations
}
"A date-time without a time-zone in the ISO-8601 calendar system in the format of 1970-01-01T00:00:00"
scalar LocalDateTime
scalar Long
scalar Unit

type BaseEntityReference {
  "The database ID of the entity"
  id: Long!
  "The UUID of the entity"
  uuid: String!
  "The language bundle ID of the entity"
  bundleId: Long!
  "The owner of the entity"
  owner: String!
}

"A configuration of a transform which controls how licensed materials are cited in openEQUELLA."
type Citation {
  "Name for the citation"
  name: String!
  "Name of the XSLT file for citation - can be downloaded from the server"
  transformation: String!
}

"The details for an entity that is now ready to be edited, or the updated details for that entity after editing."
type EditableEntityMetadataSchema {
  "Base entity being edited"
  entity: MetadataSchema!
  "The ID of the staging area for this entity. This is used to store files before they are committed."
  stagingId: String!
  "The version of openEQUELLA this entity is being edited against. This is used to ensure that edits are applied to the correct version."
  version: String
  "A list of access control entries, each specifying a privilege granted to a user or group, along with whether it is overridden or granted."
  targetList: [TargetListEntry!]!
}

"A skeleton for creating a new editable entity, containing essential metadata such as UUID, owner, and staging ID."
type EditableEntitySkeleton {
  "Unique identifier for the new entity"
  uuid: String!
  "Owner of the new entity, typically the user who is creating it"
  owner: String!
  "Staging ID for the new entity, used to store files before they are committed"
  stagingId: String!
}

"Common details for entities, including identifiers, ownership, timestamps, and additional attributes."
type EntityDetails {
  "Unique identifier for this entity."
  id: Long!
  "Universally unique identifier for this entity, used for referencing across different entities."
  uuid: String!
  "Owner of this entity, typically the user who created it."
  owner: String!
  "Timestamp for when this entity was created - only valid when starting an edit on an existing entity."
  dateCreated: LocalDateTime
  "Timestamp for when this entity was last modified - only valid when starting an edit on an existing entity."
  dateModified: LocalDateTime
  "Language bundle ID for the _name_ of this entity, used for internationalization."
  nameBundleId: Long
  "Language bundle ID for the _description_ of this entity, used for internationalization."
  descriptionBundleId: Long
  "A map of additional attributes for this entity, allowing for flexible metadata storage."
  attributes: [KVStringString!]!
  "Indicates whether this entity is disabled, affecting its visibility and usability."
  disabled: Boolean!
}

type Group {
  "The unique identifier for the group - typically a UUID"
  uniqueId: String!
  "The name of the group"
  name: String!
  "The description for the group"
  description: String
  "The unique identifier of the parent group, or null if this is a top-level group"
  parentId: String
  "Whether this group has sub-groups"
  hasGroups: Boolean!
  "Whether this group has users"
  hasUsers: Boolean!
}

"A Connection object paging through Groups as per the GraphQL Cursor Connections Specification"
type GroupConnection {
  pageInfo: PageInfo!
  edges: [GroupEdge!]!
}

"An Edge object for Groups as per the GraphQL Cursor Connections Specification"
type GroupEdge {
  cursor: String!
  node: Group!
}

"A key-value pair of String and String"
type KVStringString {
  "Key"
  key: String!
  "Value"
  value: String!
}

"A metadata schema, which defines the structure and transforms for metadata items in openEQUELLA."
type MetadataSchema {
  "Details of the metadata schema, including UUID and owner"
  details: EntityDetails!
  "Transforms applied when exporting this schema between repositories"
  exportTransforms: [MetadataSchemaTransform!]!
  "Transforms applied when importing this schema between repositories"
  importTransforms: [MetadataSchemaTransform!]!
  "Path to the name attribute in the schema"
  itemNamePath: String!
  "Path to the description attribute in the schema"
  itemDescriptionPath: String!
  "XML definition of the schema"
  definition: String!
  "List of citations associated with this schema"
  citations: [Citation!]!
}

"A schema transform that defines how metadata is transformed during export or import operations with external systems."
type MetadataSchemaTransform {
  "Filename of the schema transform stored on the server - managed via staging area"
  filename: String!
  "Type of the schema transform, e.g., OAI_Identity, HARVESTER, OAI_DC"
  schemaType: String!
}

type Mutations {
  "Create a new internal user"
  internalUserCreate("Username of the user to create which they'll use for authentication - must be unique" username: String!, "Email address of the user" email: String, "First name of the user" firstName: String!, "Last name of the user" lastName: String!, "Password of the user - will be hashed on store" password: String!): User
  "Update an existing internal user"
  internalUserUpdate("ID of existing user to update - used to find target user" id: String!, "New username of the user - should be unique" username: String, "New email address of the user" email: String, "New first name of the user" firstName: String, "New last name of the user" lastName: String, "New password of the user - will be hashed on store" password: String): User
  "Delete an existing internal user"
  internalUserDelete("The unique ID of the user to delete" id: String!): Unit
  "Create a new group"
  internalGroupCreate("The name of the group to create" name: String!, "The unique ID of the parent group to create the new group under - or none for the root" parentId: String): Group
  "Delete a group by its unique ID"
  internalGroupDelete("The unique ID of the group to delete" uniqueId: String!, "Whether to delete all children of the group, or move them to the parent of the group being deleted" deleteChildren: Boolean!): Unit
  "Update a group by its unique ID - can also be used to move group within the hierarchy by changing the parent ID"
  internalGroupUpdate("The unique ID of the group to update" uniqueId: String!, "The new name of the group" name: String, "The new description for the group" description: String, "The new parent ID of the group" parentId: String, "The updated list of users in the group - replacing what was previously there." users: [String!]): Group
  "Start editing an existing metadata schema. Expected that it will be followed by a metadataSchemaStopEdit or metadataSchemaCancelEdit operation."
  metadataSchemaStartEdit("ID of the metadata schema to edit, or none to create a new one" id: Long!): EditableEntityMetadataSchema!
  "Start creating a new metadata schema. Expected that it will be followed by a metadataSchemaStopEdit or metadataSchemaCancelEdit operation."
  metadataSchemaStartCreate: EditableEntitySkeleton!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Queries {
  "List all internal users, optionally filtered by a query"
  internalUsers("A string to filter users by" query: String, "Pagination - how many items to return from the start of the possible list of items" first: Int, "Pagination - how many items to return from the end of the possible list of items" last: Int, "Pagination - the cursor for a item before which all items should be returned" before: String, "Pagination - the cursor for a item after which all items should be returned" after: String): UserConnection
  "Retrieve details of a user based on username"
  internalUserByUsername("Username of the user to retrieve" username: String!): User
  "Retrieve details of a user based on unique ID"
  internalUserById("Unique ID of the user to retrieve" id: String!): User
  "Retrieve a group by its unique ID"
  internalGroupById("The unique ID of the group to retrieve" uniqueId: String!): Group
  "Retrieve a group by its name"
  internalGroupByName("The name of the group to retrieve" name: String!): Group
  "List all groups at a specific level in the hierarchy determined by the parent ID - or none for the root."
  internalGroups("The unique ID of the parent group to list groups for - or none for the root" parentId: String, "Pagination - how many items to return from the start of the possible list of items" first: Int, "Pagination - how many items to return from the end of the possible list of items" last: Int, "Pagination - the cursor for a item before which all items should be returned" before: String, "Pagination - the cursor for a item after which all items should be returned" after: String): GroupConnection
  "List multiple groups by their unique IDs, invalid IDs will be ignored"
  internalGroupsByIds("The unique IDs of the groups to retrieve" uniqueIds: [String!]!, "Pagination - how many items to return from the start of the possible list of items" first: Int, "Pagination - how many items to return from the end of the possible list of items" last: Int, "Pagination - the cursor for a item before which all items should be returned" before: String, "Pagination - the cursor for a item after which all items should be returned" after: String): GroupConnection
  "Search for groups anywhere within the hierarchy by name (wildcard search)"
  internalGroupSearch("The query string to search for groups by (server will surround with wildcard)" query: String!, "Pagination - how many items to return from the start of the possible list of items" first: Int, "Pagination - how many items to return from the end of the possible list of items" last: Int, "Pagination - the cursor for a item before which all items should be returned" before: String, "Pagination - the cursor for a item after which all items should be returned" after: String): GroupConnection
  "List user ids for all users in the specified group"
  internalGroupUsers("The unique ID of the group to list users for" uniqueId: String!, "Pagination - how many items to return from the start of the possible list of items" first: Int, "Pagination - how many items to return from the end of the possible list of items" last: Int, "Pagination - the cursor for a item before which all items should be returned" before: String, "Pagination - the cursor for a item after which all items should be returned" after: String): StringConnection
  "List all metadata schemas"
  metadataSchemas: [BaseEntityReference!]!
  "Export a metadata schema, returning a base64 encoded zip file"
  metadataSchemaExport("ID of the metadata schema to export" id: Long!, "Whether to include security information in the export" withSecurity: Boolean!): String
  "Get the metadata schema ID for a given UUID"
  metadataSchemaIdForUuid(value: String!): Long
}

"A Connection object paging through Strings as per the GraphQL Cursor Connections Specification"
type StringConnection {
  pageInfo: PageInfo!
  edges: [StringEdge!]!
}

"An Edge object for Strings as per the GraphQL Cursor Connections Specification"
type StringEdge {
  cursor: String!
  node: String!
}

type TargetListEntry {
  "Whether the privilege is granted or revoked"
  granted: Boolean!
  "Has precedence over other actions in the list"
  overridden: Boolean!
  "The privilege being granted or revoked, e.g., 'VIEW_ITEM', 'EDIT_SCHEMA', etc."
  privilege: String!
  "The user, group or other entity this applies to. Expecting values like '*', 'U:<username>', 'G:<groupname>' etc."
  who: String!
  "An optional postfix for the entry, used for additional context or information - defaults to empty string"
  postfix: String!
}

type User {
  "The unique identifier for the user"
  uniqueId: String!
  "The username a user authenticates with"
  username: String!
  "User's email address"
  email: String
  "User's first name"
  firstName: String!
  "User's last name"
  lastName: String!
}

"A Connection object paging through Users as per the GraphQL Cursor Connections Specification"
type UserConnection {
  pageInfo: PageInfo!
  edges: [UserEdge!]!
}

"An Edge object for Users as per the GraphQL Cursor Connections Specification"
type UserEdge {
  cursor: String!
  node: User!
}