  "XPath to the metadata node"
  node: String
  "The type of display for this node"
  nodeType: String
  "The display mode for this node"
  mode: String
  "Splitter character between repeated node values"
  splitter: String
  "Display title for this node"
  title: LanguageBundle
  "Maximum display length before truncation"
  truncateLength: Int
}

"A rule that applies dynamic ACL entries to an item based on its metadata values."
type CollectionDynamicMetadataRule {
  "Unique identifier for this rule"
  ruleId: String
  "Display name for this rule"
  name: String
  "XPath to the metadata node whose values drive the ACL"
  path: String
  "Type of dynamic rule"
  ruleType: String
  "ACL entries applied by this rule"
  targetList: [TargetListEntry!]!
}

"An HTML metadata field mapping."
type CollectionHtmlMapping {
  "HTML source field name"
  html: String!
  "Collection metadata target path"
  itemdef: String!
}

"An IMS/LOM metadata field mapping."
type CollectionImsMapping {
  "IMS/LOM source field path"
  ims: String!
  "Collection metadata target path"
  itemdef: String!
  "Mapping type"
  mappingType: String!
  "Whether to replace existing values at the target path"
  replace: Boolean!
}

"A rule that controls access to an item based on its metadata."
type CollectionItemMetadataRule {
  "Unique identifier for this rule"
  ruleId: String
  "Display name for this rule"
  name: String
  "Script that evaluates the metadata condition"
  script: String
}

"A literal value used to trigger a metadata mapping."
type CollectionLiteral {
  "The literal value to match"
  value: String
  "A script to compute the mapping value"
  script: String
}

"A literal value metadata mapping."
type CollectionLiteralMapping {
  "Collection metadata target path"
  value: String
  "Literal values that trigger this mapping"
  literals: [CollectionLiteral!]!
}

"Configuration for mapping external metadata formats to collection metadata."
type CollectionMetadataMapping {
  "IMS/LOM metadata mappings"
  imsMapping: [CollectionImsMapping!]!
  "HTML metadata mappings"
  htmlMapping: [CollectionHtmlMapping!]!
  "Literal value metadata mappings"
  literalMapping: [CollectionLiteralMapping!]!
}

type CollectionMutations {
  "Start editing an existing collection. Expected to be followed by a stopEdit or cancelEdit operation."
  startEdit("ID of the collection to edit" id: Long!): EditableEntityCollectionDefinition!
  "Clone a collection - creating a copy of the collection with a new ID."
  clone("ID of the collection to clone" id: Long!): BaseEntityReference
  "Delete a collection - with consideration to references controllable by args."
  delete("ID of the collection to delete" id: Long!, "Whether to check for referencing entities before deletion, if true, the deletion will only proceed if there are no referencing entities; if false, will attempt to delete the collection regardless of references which may fail. Defaults to true if not provided." checkReferences: Boolean): Unit
  "Import a collection from a base64-encoded zip file."
  import("Base64-encoded zip file of the collection to import" zipBase64: String!): EditableEntityCollectionDefinition
  "Cancel editing a collection - discarding any changes made and unlocking the collection."
  cancelEdit("ID of the collection edit session to cancel" id: Long!, "Whether to force cancel the edit session, if true, removes the lock regardless of which session owns it (forced unlock); if false, only removes the lock if the current session owns it. Defaults to false if not provided." force: Boolean): Unit
}

type CollectionQueries {
  "List all collections"
  list: [BaseEntityReference!]!
  "Export a collection, returning a base64 encoded zip file"
  export("ID of the collection to export" id: Long!, "Whether to include security information in the export" withSecurity: Boolean!): String
  "Get the collection ID for a given UUID"
  idForUuid(value: String!): Long
}

