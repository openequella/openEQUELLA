  strings: [LanguageString!]!
}

"A single translation of a piece of text for a specific locale."
type LanguageString {
  "Unique identifier for this language string."
  id: Long!
  "Priority of this language string, with lower numbers indicating higher priority."
  priority: Int!
  "Locale code for this language string, e.g., 'en' for English."
  locale: String!
  "The translated text for this locale."
  text: String!
}

"A metadata schema, which defines the structure and transforms for metadata items in openEQUELLA."
type MetadataSchema {
  "Details of the metadata schema, including UUID and owner"
  details: EntityDetails!
  "Transforms applied when exporting this schema between repositories"
  exportTransforms: [MetadataSchemaTransform!]!
  "Transforms applied when importing this schema between repositories"
  importTransforms: [MetadataSchemaTransform!]!
  "Path to the name attribute in the schema"
  itemNamePath: String!
  "Path to the description attribute in the schema"
  itemDescriptionPath: String!
  "XML definition of the schema"
  definition: String!
  "List of citations associated with this schema"
  citations: [Citation!]!
}

type MetadataSchemaMutations {
  "Start editing an existing metadata schema. Expected that it will be followed by a stopEdit or cancelEdit operation."
  startEdit("ID of the metadata schema to edit, or none to create a new one" id: Long!): EditableEntityMetadataSchema!
  "Start creating a new metadata schema. Typically followed by an add operation with details for new schema."
  startCreate: EditableEntitySkeleton!
  "Cancel editing a metadata schema - discarding any changes made and unlocking the schema."
  cancelEdit("ID of the metadata schema edit session to cancel" id: Long!, "Whether to force cancel the edit session, if true, removes the lock regardless of which session owns it (forced unlock); if false, only removes the lock if the current session owns it. Defaults to false if not provided." force: Boolean): Unit
  "Add a new metadata schema - typically after a startCreate operation, with details for the new schema."
  add("Details of the metadata schema to add" details: EditableEntityMetadataSchemaInput!, "Whether the newly added schema should be locked for editing after creation" lockAfterwards: Boolean!): BaseEntityReference
  "Delete a metadata schema - with consideration to references controllable by args."
  delete("ID of the metadata schema to delete" id: Long!, "Whether to check for referencing entities before deletion, if true, the deletion will only proceed if there are no referencing entities; if false, will attempt to delete the schema regardless of references which may fail. Defaults to true if not provided." checkReferences: Boolean): Unit
}

type MetadataSchemaQueries {
  "List all metadata schemas"
  list: [BaseEntityReference!]!
  "Export a metadata schema, returning a base64 encoded zip file"
  export("ID of the metadata schema to export" id: Long!, "Whether to include security information in the export" withSecurity: Boolean!): String
  "Get the metadata schema ID for a given UUID"
  idForUuid(value: String!): Long
  "Get a metadata schema by ID"
  byId("ID of the metadata schema" id: Long!): MetadataSchema
  "Get the uses of a metadata schema by ID"
  uses("ID of the metadata schema" id: Long!): [BaseEntityReference!]!
  "Get the types of schema import transformations for a metadata schema by ID"
  importTypes("ID of the metadata schema" id: Long!): [String!]!
  "Check if a metadata schema has an referencing entities"
  hasReferences("ID of the metadata schema" id: Long!): Boolean!
}

"A schema transform that defines how metadata is transformed during export or import operations with external systems."
type MetadataSchemaTransform {
  "Filename of the schema transform stored on the server - managed via staging area"
  filename: String!
  "Type of the schema transform, e.g., OAI_Identity, HARVESTER, OAI_DC"
  schemaType: String!
}

type Mutations {
  "Operations for managing internal users"
  internalUsers: InternalUserMutations!
  "Operations for managing internal groups"
  internalGroups: InternalGroupMutations!
  "Operations for managing Metadata Schemas"
  metadataSchema: MetadataSchemaMutations!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Queries {
  "Queries for internal users"
  internalUsers: InternalUserQueries!
  "Queries for internal groups"
  internalGroups: InternalGroupQueries!
  "Queries for Metadata Schemas"
  metadataSchema: MetadataSchemaQueries!
}

