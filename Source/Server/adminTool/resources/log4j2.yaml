# This is the Log4j2 configuration file used when launching the admin console via
# com.tle.client.harness.ClientLauncher. This is commonly done via a run configuration in
# IntelliJ IDEA when developing the admin console. As a result, it makes sense for it to include
# debug level logging for key packages.
Configuration:
  status: warn

  appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      Filters:
        ThresholdFilter:
          level: debug
      PatternLayout:
        Pattern: "%d{ABSOLUTE} [%15.15t] %-5p [%35.35c{1.3.*}] %m%n"
    RollingFile:
      name: FILE
      fileName: oeq-admin.log
      filePattern: "oeq-admin-%i.log"
      immediateFlush: true
      append: true
      PatternLayout:
        Pattern: "%d{ABSOLUTE} [%20.20t] %-5p [%35.35c{1.3.*}] %m%n"
      Policies:
        SizeBasedTriggeringPolicy:
          size: 10 MB
      DefaultRollOverStrategy:
        max: 3

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: STDOUT
        - ref: FILE
    Logger:
      name: com.tle
      level: debug
