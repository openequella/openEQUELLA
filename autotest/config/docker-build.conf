// Autotest configuration for running the suite inside the build container, as described in
// docker/docker-build/README.md. Point AUTOTEST_CONFIG at this file rather than editing
// config/resources/application.conf, which is for your own machine.
server.url = "http://localhost:8080/"
server.password = autotestpassword

webdriver.chrome {
  driver = ${HOME}"/chromedriver"
  headless = true
}

tests {
  install = true
  suitenames = ["all.yaml"]
  parallel = true
  maxthreads = 2
  newui = true
}

install {
  dir = ${HOME}
}
