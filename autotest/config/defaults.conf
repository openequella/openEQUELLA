// Base settings for every autotest run. autotest/build.sbt always loads this file, then layers the
// chosen configuration over the top - config/resources/application.conf by default, or whatever
// AUTOTEST_CONFIG points at. Nothing here should be specific to one environment; put that in the
// overlaying file instead.
install {
  hostname = "localhost"
  port = 8080
  url = "http://localhost:8080/"
  jacoco = "output=tcpserver"
  db {
    host = "localhost"
    port = 5432
    type = "postgresql"
    name = "equellatests"
    user = "equellatests"
    password = "password"
  }
  zip = "Installer/target/equella-installer-2019.2.zip",
  auditLevel = "NORMAL"
}

tests {
  verbose = 5
  parallel = true
  suitenames = ["testng.xml"]
}

coverage {
  hosts = ["localhost:6300"]
}
