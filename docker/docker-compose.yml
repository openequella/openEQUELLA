services:
  oeq:
    build:
      context: .
      args:
        - OEQ_INSTALL_FILE=installer.zip
    networks:
      - oeq-cluster
    links:
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=oeq-cluster"
      - "traefik.http.routers.oeq.rule=Host(`oeq.localhost`)"
      - "traefik.http.routers.oeq.entrypoints=web"
      - "traefik.http.routers.oeq.service=oeq-service"
      - "traefik.http.services.oeq-service.loadbalancer.server.port=8080"
      - "traefik.http.services.oeq-service.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.oeq-service.loadbalancer.sticky.cookie.name=JSESSIONNODE"
    environment:
      - EQ_MESSAGING_BINDPORT=8999
      - EQ_MESSAGING_USEHOSTNAME=true
      - EQ_USERSERVICE_USEXFORWARDEDFOR=true
      - EQ_ZOOKEEPER_INSTANCES=zookeeper
      - EQ_ZOOKEEPER_PREFIX=eqdev
      - EQ_ADMIN_URL=http://oeq.localhost/admin/
      - EQ_HIBERNATE_CONNECTION_URL=jdbc:postgresql://database:5432/equella
    depends_on:
      - zookeeper
    volumes:
      - ./filestore:/home/equella/equella/filestore
      - ./hikari.properties:/home/equella/equella/learningedge-config/hikari.properties
      - ./learningedge-log4j.yaml:/home/equella/equella/learningedge-config/learningedge-log4j.yaml

  zookeeper:
    image: zookeeper:3.9.5
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
      ZOO_LOG4J_PROP: INFO, CONSOLE, ROLLINGFILE
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
    networks:
      - oeq-cluster

  database:
    image: postgres:18.2
    restart: always
    networks:
      - oeq-cluster
    environment:
      - POSTGRES_DB=$OEQ_DATABASE_NAME
      - POSTGRES_USER=$OEQ_DATABASE_USERNAME
      - POSTGRES_PASSWORD=$OEQ_DATABASE_PASSWORD

  traefik:
    image: traefik:v3.6.10
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8081:8080"
      - "80:80"
    networks:
      - oeq-cluster
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  oeq-cluster:
    driver: bridge
